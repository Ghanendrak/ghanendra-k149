name: Build DS Kushwaha Group APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle clean assembleDebug
      - name: Android 14 launch and stability test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 1200
          script: bash scripts/android14-smoke-test.sh
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DS-KUSHWAHA-GROUP-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android 14 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DS-KUSHWAHA-GROUP-android14-test-evidence
          path: smoke-test-results/
          if-no-files-found: ignore
