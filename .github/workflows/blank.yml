name: Build DS Kushwaha Group APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Android 14 emulator launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle installDebug
            adb shell am force-stop com.dskushwahagroup.shop
            adb shell am start -n com.dskushwahagroup.shop/.MainActivity
            sleep 20
            adb shell pidof com.dskushwahagroup.shop
            adb logcat -d -t 3000 > /tmp/dskg-logcat.txt
            ! grep -q "FATAL EXCEPTION" /tmp/dskg-logcat.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DS-KUSHWAHA-GROUP-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
